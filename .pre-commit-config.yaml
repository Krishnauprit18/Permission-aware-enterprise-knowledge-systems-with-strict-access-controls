repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
  - repo: local
    hooks:
      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --directory backend ruff format --check src tests
        language: system
        pass_filenames: false
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --directory backend ruff check src tests
        language: system
        pass_filenames: false
      - id: backend-mypy
        name: backend mypy
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
      - id: frontend-format
        name: frontend prettier
        entry: npm --prefix frontend run fmt:check
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
