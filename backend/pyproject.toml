[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "permission-aware-knowledge-backend"
version = "0.1.0"
description = "Typed local-first scaffold for a permission-aware enterprise knowledge system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "PyJWT[crypto]>=2.9,<3",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
semantic = [
  "fastembed>=0.8,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.7,<2",
  "cyclonedx-bom>=4.6,<5",
  "detect-secrets>=1.5,<2",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_system"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["A", "B", "C4", "DTZ", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "unit: fast isolated tests",
  "integration: tests spanning local package boundaries",
  "security: security regression tests",
]

[tool.coverage.run]
branch = true
source = ["knowledge_system"]

[tool.coverage.report]
fail_under = 90
show_missing = true
